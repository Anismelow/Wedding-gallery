spring.application.name=wedding-gallery-api


# Lee el .env de la raíz, arranques desde la raíz o desde backend/
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Carpeta donde se guardan las fotos (en producción vendrá del entorno)
app.storage.location=${STORAGE_LOCATION:uploads}