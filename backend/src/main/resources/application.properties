spring.application.name=wedding-gallery-api

# Lee el .env de la raíz, arranques desde la raíz o desde backend/
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Carpeta donde se guardan las fotos (cada máquina la define en su .env)
app.storage.location=${STORAGE_LOCATION:uploads}

# Código de acceso del QR (sin valor por defecto: si falta, la app no arranca)
app.access.code=${ACCESS_CODE}

# Subida de fotos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Errores en formato ProblemDetail (RFC 9457)
spring.mvc.problemdetails.enabled=true

# Paginación: como mucho 50 fotos por página
spring.data.web.pageable.max-page-size=50